<!DOCTYPE html>
<html>
<head>
    <title>Admin - Maahir Exchange</title>
    <style>
        body {
            font-family: Arial;
            background: #0a0a14;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .box {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #333;
        }
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
        }
        .btn-on {
            background: #ef4444;
            color: #fff;
        }
        .btn-off {
            background: #22c55e;
            color: #fff;
        }
        .status {
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .status.on {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .status.off {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔧 Admin Control</h1>
        <div id="status" class="status">Loading...</div>
        
        <button class="btn-on" onclick="turnOn()">🔴 Turn ON Maintenance</button>
        <button class="btn-off" onclick="turnOff()">🟢 Turn OFF Maintenance</button>
        
        <p style="color:#666;margin-top:20px;font-size:14px;">
            💡 Users see maintenance.html when ON
        </p>
    </div>

    <script>
        function updateStatus() {
            const status = localStorage.getItem('maintenance');
            const el = document.getElementById('status');
            if (status === 'on') {
                el.className = 'status on';
                el.textContent = '🛠️ MAINTENANCE MODE: ON';
            } else {
                el.className = 'status off';
                el.textContent = '✅ SITE IS LIVE';
            }
        }

        function turnOn() {
            if (confirm('Turn ON maintenance mode?')) {
                localStorage.setItem('maintenance', 'on');
                updateStatus();
                alert('✅ Maintenance mode ON!');
            }
        }

        function turnOff() {
            if (confirm('Turn OFF maintenance mode?')) {
                localStorage.removeItem('maintenance');
                updateStatus();
                alert('✅ Site is LIVE!');
            }
        }

        updateStatus();
    </script>
</body>
</html>
